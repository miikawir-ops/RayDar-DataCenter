<!DOCTYPE html>

<head>

<meta property="og:title" content="Sanasto — RayDar Data Center">
<meta property="og:description" content="Datakeskusten liiketoimintamallien sanasto: kaikki esityksessä käytetyt termit aakkosjärjestyksessä.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://datacenter.raydar.fi/business-models/glossary.html">
<meta property="og:image" content="https://datacenter.raydar.fi/business-models/assets/og-image-fi.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="Otsikko Datakeskusten liiketoimintamallit kuvan päällä, jossa datakeskus on esitetty kerroksittain.">
<meta property="og:locale" content="fi_FI">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preload" href="assets/fonts/ibm-plex-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/space-grotesk-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/explainer.css">
</head>
<body data-page="glossary">

<header id="bm-header" class="bm-header"></header>

<main class="page page--doc">
  <!-- Ported from Sanasto.dc.html (approved design, Tilanne 9/2026). The term
       cards are rendered from assets/glossary-fi.js, the same data the inline
       tooltips on every page use, so the two can't drift apart. Each card has
       id="g-<key>", e.g. glossary.html#g-rack. -->
  <div class="page-head page-head--doc">
    <div class="kicker">KÄSITTEET</div>
    <h1 class="page-title">Sanasto</h1>
    <div class="page-lede">Kaikki esityksessä käytetyt termit aakkosjärjestyksessä (68 termiä)</div>
  </div>
  <div class="glossary-grid" id="glossary-grid"></div>
</main>

<footer id="bm-footer" class="bm-footer"></footer>

<script src="assets/glossary-fi.js"></script>
<script src="assets/chrome.js"></script>
<script>
(function () {
  const grid = document.getElementById("glossary-grid");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  Object.entries(window.BM_GLOSSARY).forEach(([key, g]) => {
    const card = el("div", "glossary-card panel");
    card.id = "g-" + key;
    const head = el("div", "term-head");
    head.appendChild(el("div", "term-name", g.term));
    if (g.alt) head.appendChild(el("div", "term-alt", g.alt));
    card.appendChild(head);
    card.appendChild(el("p", "", g.definition));
    grid.appendChild(card);
  });
  // Cards are rendered after load, so a #g-<key> link needs a second jump.
  if (location.hash.startsWith("#g-")) {
    const target = document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView();
  }
})();
</script>
</body>
</html>
