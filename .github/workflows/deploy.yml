name: Deploy RayDar Data Center dashboard

# Actions-based Pages deploy (PLAN.md step 7): generates index.html fresh
# each run and uploads it as a Pages artifact — never committed to git.
#
# LIVE since 2026-09-20 (miikawir-ops.github.io/RayDar-DataCenter/). There
# is no push trigger: a pushed change goes live at the next scheduled run
# or a manual workflow_dispatch.

on:
  schedule:
    # 12:00 UTC, weekdays — ~7-8am US Eastern. Decision #7: daily-only to
    # start. Adjust anytime; not a load-bearing choice.
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}   # manual "Run workflow" button — no Pages requirement to exist as an option

permissions:
  contents: read   # checkout only — nothing is committed back to the repo
  pages: write     # required by actions/deploy-pages
  id-token: write  # required by actions/deploy-pages (OIDC)

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (fetch -> score -> capex -> render)
        run: python main.py --now
        # No secrets needed: yfinance and the RSS feeds fetch_market.py
        # uses are both unauthenticated (verified — grepped this project's
        # own fetch code and reference/fetch_market.py for API-key/env-var
        # usage, found none). GITHUB_TOKEN above is the only credential
        # involved, and Actions provides it automatically.

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp ecosystem.html _site/ecosystem.html
          cp ecosystem-data.v5.js _site/ecosystem-data.v5.js
          cp assets/ecosystem-v2.webp _site/assets/ecosystem-v2.webp
          cp -r business-models _site/business-models
          test -f _site/business-models/index.html
        # Only the generated dashboard, the hand-authored ecosystem page
        # and its image, and the Finnish business-models pages are uploaded
        # — not the whole repo (source files, PLAN.md, reference/, etc. stay
        # out of the deployed site regardless of the repo's own visibility).
        # business-models/ is copied as a whole folder, so a new page or
        # asset can't be silently left out. The test fails the run if the
        # hub page is missing, e.g. if an ignore rule ever drops it from git
        # again (a bare "index.html" pattern once matched it).

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
