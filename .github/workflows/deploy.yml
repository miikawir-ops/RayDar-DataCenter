name: Deploy RayDar Data Center dashboard

# Actions-based Pages deploy (PLAN.md step 7): generates index.html fresh
# each run and uploads it as a Pages artifact — never committed to git.
# The score history and audit log persist between runs on the data branch
# (ledger R33a): the build restores them before the pipeline and hands the
# updated files to save-history, the only job allowed to write to the repo.
#
# LIVE since 2026-09-20 (miikawir-ops.github.io/RayDar-DataCenter/). There
# is no push trigger: a pushed change goes live at the next scheduled run
# or a manual workflow_dispatch.

on:
  schedule:
    # 12:00 UTC, weekdays — ~7-8am US Eastern. Decision #7: daily-only to
    # start. Adjust anytime; not a load-bearing choice.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:      # manual "Run workflow" button — no Pages requirement to exist as an option
    inputs:
      test_failure:
        description: "Fail on purpose before anything is built or deployed (tests the failure issue)"
        type: boolean
        default: false

permissions:
  contents: read   # checkout and reading the data branch; only save-history writes
  pages: write     # required by actions/deploy-pages
  id-token: write  # required by actions/deploy-pages (OIDC)

# One run at a time, so a run's restore -> pipeline -> save can't interleave
# with another run's.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deliberate test failure (manual runs only)
        if: ${{ inputs.test_failure }}
        run: |
          echo "Failing on purpose: test_failure was set on a manual run."
          exit 1
        # Scheduled runs have no inputs, so this never runs on schedule.
        # Fails before checkout, so nothing is built or deployed and the
        # live site keeps its last deployment (ledger R38).

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore history and audit log from the data branch
        run: |
          git fetch --depth=1 origin data:refs/remotes/origin/data
          git show origin/data:scores_history.json > scores_history.json
          git show origin/data:audit_log.json > audit_log.json
          python -c "import json; h = json.load(open('scores_history.json')); a = json.load(open('audit_log.json')); print(f'Restored {len(h)} sessions of history and {len(a)} audit entries')"
        # Fails the run if the branch, either file, or valid JSON is missing:
        # a run never silently starts a fresh history (ledger R33a/R33d).
        # The first run started from the empty files committed to the data
        # branch on 2026-10-15.

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (fetch -> score -> capex -> render)
        env:
          # SEC asks for a contact in the User-Agent ("Name email"); unset,
          # EDGAR may refuse and revenue acceleration shows as "not measured"
          # (edgar.py, ledger R88). yfinance and the RSS feeds need nothing.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python main.py --now

      - name: Hand the history and audit log to the save job
        uses: actions/upload-artifact@v4
        with:
          name: history
          path: |
            scores_history.json
            audit_log.json
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp ecosystem.html _site/ecosystem.html
          cp ecosystem-data.v11.js _site/ecosystem-data.v11.js
          cp dashboard-companies.js _site/dashboard-companies.js
          cp assets/ecosystem-v2.webp _site/assets/ecosystem-v2.webp
          cp -r business-models _site/business-models
          test -f _site/business-models/index.html
        # Only the generated dashboard, the hand-authored ecosystem page
        # and its image, and the Finnish business-models pages are uploaded
        # — not the whole repo (source files, PLAN.md, reference/, etc. stay
        # out of the deployed site regardless of the repo's own visibility).
        # business-models/ is copied as a whole folder, so a new page or
        # asset can't be silently left out. The test fails the run if the
        # hub page is missing, e.g. if an ignore rule ever drops it from git
        # again (a bare "index.html" pattern once matched it).

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  save-history:
    # Saves this run's history and audit log to the data branch (ledger
    # R33a). The only job with write access to the repo, and it runs no
    # pipeline code: it commits the two files the build handed over. It
    # runs only after a successful build and deploy.
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Download the build's files
        uses: actions/download-artifact@v4
        with:
          name: history
          path: _incoming

      - name: Commit and push to the data branch
        run: |
          python3 -c "import json; [json.load(open('_incoming/' + f)) for f in ('scores_history.json', 'audit_log.json')]"
          cp _incoming/scores_history.json _incoming/audit_log.json .
          rm -rf _incoming
          session=$(python3 -c "import json; print(max(e['date'] for e in json.load(open('scores_history.json'))))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores_history.json audit_log.json
          if git diff --cached --quiet; then echo "Nothing changed; nothing to save"; exit 0; fi
          git commit -m "data: session $session (run $GITHUB_RUN_ID, $GITHUB_EVENT_NAME)"
          git push origin HEAD:data

  report-failure:
    # Opens an issue when the run fails (ledger R33f, R36, R38). GitHub's
    # own failure email didn't arrive for the failed 2026-10-05 scheduled
    # run, so this is the notification of record. A separate job, so
    # build-and-deploy keeps its read-only contents token; this job gets
    # issues: write and nothing else. Covers a failed save too (R33a).
    needs: [build-and-deploy, save-history]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          when="$(date -u +'%Y-%m-%d %H:%M') UTC"
          body="The dashboard workflow failed.

          - Run: $RUN_URL
          - Trigger: $EVENT
          - Branch: $REF
          - Commit: $SHA

          If the build failed, nothing was deployed and the live site still shows the last successful run. If only save-history failed, the page is live but this session's scores weren't stored on the data branch, so later runs will name this session as missing. Close this issue once the cause is fixed."
          gh issue create --title "Dashboard run failed: $EVENT, $when" --assignee "$OWNER" --body "$body"
